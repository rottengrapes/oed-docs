services:
  zensical:
    image: zensical/zensical:latest
    container_name: observearth-docs
    restart: unless-stopped
    ports:
      - "${ZENSICAL_PORT:-7890}:8000"
    volumes:
      - .:/docs
    command: serve --dev-addr 0.0.0.0:8000
    environment:
      - PYTHONUNBUFFERED=1

  # Alternative fallback using mkdocs-material
  mkdocs:
    image: squidfunk/mkdocs-material:latest
    container_name: observearth-mkdocs-fallback
    profiles: ["mkdocs"]
    restart: unless-stopped
    ports:
      - "${MKDOCS_PORT:-7892}:8000"
    volumes:
      - .:/docs
    command: serve --dev-addr 0.0.0.0:8000